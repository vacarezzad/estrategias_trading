name: Datos + backtests

on:
  schedule:
    - cron: "30 22 * * 5"   # viernes 19:30 (Buenos Aires)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bt/**", "run_backtests.py", "tests/**"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir -r requirements.txt yfinance
      - name: Precios (yfinance)
        if: github.event_name != 'push'
        run: python scripts/download_prices.py
      - name: Test de leakage
        run: python -m pytest -q tests
      - name: Backtests
        run: python run_backtests.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data results
          git diff --cached --quiet || git commit -m "datos y backtests $(date -u +%F) [skip ci]"
          git push
